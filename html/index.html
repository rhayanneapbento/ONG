<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ONG</title>

    <link rel="stylesheet" href="../css/style.css">

    <!-- Biblioteca SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <main>

        <section>
            <h2>Sobre a ONG</h2>

            <p>
                Nossa ONG ajuda pessoas que precisam e realiza projetos
                para melhorar a vida da comunidade.
            </p>

            <img src="../imagens/ong.jpeg" alt="Imagem da ONG">
        </section>

        <section>
            <h2>Contato</h2>

            <p>Telefone: (35) 99999-9999</p>
            <p>E-mail: contato@ong.com</p>
            <p>Endereço: São Lourenço - MG</p>

            <form id="formulario">

                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome">

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email">

                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem"></textarea>

                <button type="submit">Enviar</button>

                <div id="feedback"></div>

            </form>
        </section>

        <div id="app"></div>

        <!-- BADGE -->
        <div class="badge">
            Projeto ativo
        </div>

        <!-- ALERTA -->
        <div class="alerta">
            Projeto realizado com sucesso!
        </div>

        <!-- MODAL -->
        <div class="modal">
            <div class="modal-conteudo">
                <h2>Obrigado!</h2>
                <p>Obrigado por apoiar nossa ONG.</p>
            </div>
        </div>

    </main>

    <script type="module" src="../js/script.js"></script>

</body>

</html>
